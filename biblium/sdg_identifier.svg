<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Globe base -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="#777777" stroke-width="1.5"/>
  
  <!-- Globe lines -->
  <ellipse cx="24" cy="24" rx="18" ry="8" fill="none" stroke="#777777" stroke-width="0.8"/>
  <ellipse cx="24" cy="24" rx="8" ry="18" fill="none" stroke="#777777" stroke-width="0.8"/>
  <line x1="6" y1="24" x2="42" y2="24" stroke="#777777" stroke-width="0.8"/>
  <line x1="24" y1="6" x2="24" y2="42" stroke="#777777" stroke-width="0.8"/>
  
  <!-- SDG color ring segments (17 colors) -->
  <g transform="translate(24,24)">
    <!-- Simplified color wheel -->
    <path d="M0,-16 A16,16 0 0,1 9.4,-13" fill="none" stroke="#555555" stroke-width="4"/>
    <path d="M9.4,-13 A16,16 0 0,1 15.2,-5.6" fill="none" stroke="#777777" stroke-width="4"/>
    <path d="M15.2,-5.6 A16,16 0 0,1 16,0" fill="none" stroke="#555555" stroke-width="4"/>
    <path d="M16,0 A16,16 0 0,1 15.2,5.6" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M15.2,5.6 A16,16 0 0,1 9.4,13" fill="none" stroke="#555555" stroke-width="4"/>
    <path d="M9.4,13 A16,16 0 0,1 0,16" fill="none" stroke="#777777" stroke-width="4"/>
    <path d="M0,16 A16,16 0 0,1 -9.4,13" fill="none" stroke="#aaaaaa" stroke-width="4"/>
    <path d="M-9.4,13 A16,16 0 0,1 -15.2,5.6" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M-15.2,5.6 A16,16 0 0,1 -16,0" fill="none" stroke="#777777" stroke-width="4"/>
    <path d="M-16,0 A16,16 0 0,1 -15.2,-5.6" fill="none" stroke="#555555" stroke-width="4"/>
    <path d="M-15.2,-5.6 A16,16 0 0,1 -9.4,-13" fill="none" stroke="#777777" stroke-width="4"/>
    <path d="M-9.4,-13 A16,16 0 0,1 0,-16" fill="none" stroke="#555555" stroke-width="4"/>
  </g>
  
  <!-- Center SDG text -->
  <circle cx="24" cy="24" r="8" fill="#404040"/>
  <text x="24" y="27" font-size="7" fill="#333333" text-anchor="middle" font-weight="bold">SDG</text>
  
  <!-- Search/identify indicator -->
  <circle cx="38" cy="10" r="6" fill="#777777"/>
  <circle cx="38" cy="10" r="3" fill="none" stroke="#404040" stroke-width="1.5"/>
  <line x1="40" y1="12" x2="43" y2="15" stroke="#404040" stroke-width="1.5"/>
</svg>
