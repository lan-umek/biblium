  <rect x="8" y="30" width="5" height="10" fill="#404040" rx="1"/>
  <rect x="14" y="24" width="5" height="16" fill="#404040" rx="1"/>
  <rect x="20" y="16" width="5" height="24" fill="#404040" rx="1"/>
  <rect x="26" y="20" width="5" height="20" fill="#404040" rx="1"/>
