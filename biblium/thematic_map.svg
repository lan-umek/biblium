<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Background quadrants -->
  <rect x="4" y="4" width="18" height="18" fill="#cccccc" stroke="#aaaaaa" stroke-width="1"/>
  <rect x="26" y="4" width="18" height="18" fill="#cccccc" stroke="#aaaaaa" stroke-width="1"/>
  <rect x="4" y="26" width="18" height="18" fill="#404040" stroke="#cccccc" stroke-width="1"/>
  <rect x="26" y="26" width="18" height="18" fill="#404040" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="4" y1="24" x2="44" y2="24" stroke="#777777" stroke-width="1.5"/>
  <line x1="24" y1="4" x2="24" y2="44" stroke="#777777" stroke-width="1.5"/>
  
  <!-- Bubbles (themes) -->
  <!-- Motor theme (top-right) -->
  <circle cx="35" cy="12" r="6" fill="#777777"/>
  <circle cx="32" cy="15" r="3" fill="#777777"/>
  
  <!-- Niche theme (top-left) -->
  <circle cx="12" cy="10" r="4" fill="#555555"/>
  
  <!-- Basic theme (bottom-right) -->
  <circle cx="36" cy="34" r="5" fill="#777777"/>
  <circle cx="30" cy="38" r="3" fill="#777777"/>
  
  <!-- Emerging theme (bottom-left) -->
  <circle cx="10" cy="35" r="3" fill="#555555"/>
  <circle cx="16" cy="32" r="2" fill="#555555"/>
  
  <!-- Axis labels -->
  <text x="44" y="26" font-size="4" fill="#555555" text-anchor="end">C</text>
  <text x="26" y="6" font-size="4" fill="#555555">D</text>
</svg>
