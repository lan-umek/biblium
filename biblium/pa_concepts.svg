<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Classical building (Greek temple style) -->
  <!-- Pediment (roof) -->
  <polygon points="24,4 6,16 42,16" fill="#555555" stroke="#333333" stroke-width="1"/>
  
  <!-- Entablature (beam) -->
  <rect x="6" y="16" width="36" height="4" fill="#555555"/>
  
  <!-- Columns -->
  <rect x="9" y="20" width="4" height="20" fill="#777777" rx="1"/>
  <rect x="17" y="20" width="4" height="20" fill="#777777" rx="1"/>
  <rect x="27" y="20" width="4" height="20" fill="#777777" rx="1"/>
  <rect x="35" y="20" width="4" height="20" fill="#777777" rx="1"/>
  
  <!-- Base -->
  <rect x="4" y="40" width="40" height="4" fill="#555555"/>
  
  <!-- Column capitals -->
  <rect x="8" y="19" width="6" height="2" fill="#555555"/>
  <rect x="16" y="19" width="6" height="2" fill="#555555"/>
  <rect x="26" y="19" width="6" height="2" fill="#555555"/>
  <rect x="34" y="19" width="6" height="2" fill="#555555"/>
  
  <!-- Concept indicators (small circles) -->
  <circle cx="11" cy="30" r="2" fill="#404040"/>
  <circle cx="19" cy="30" r="2" fill="#404040"/>
  <circle cx="29" cy="30" r="2" fill="#404040"/>
  
  <!-- Document indicator in corner -->
  <rect x="34" y="2" width="12" height="10" fill="#404040" stroke="#555555" stroke-width="1" rx="1"/>
  <line x1="36" y1="5" x2="44" y2="5" stroke="#555555" stroke-width="1"/>
  <line x1="36" y1="7" x2="42" y2="7" stroke="#555555" stroke-width="1"/>
  <line x1="36" y1="9" x2="44" y2="9" stroke="#555555" stroke-width="1"/>
</svg>
