name: publish to PyPI

# Sproži se ob git tagu oblike v2.19.0. Zahteva skrivnost PYPI_API_TOKEN
# (Settings → Secrets and variables → Actions) ali "trusted publishing" na PyPI.
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # za trusted publishing (če je nastavljeno na PyPI)
      contents: write   # za GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}   # izpusti, če uporabljaš trusted publishing
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
